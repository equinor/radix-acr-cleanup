apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "radix-acr-cleanup.fullname" . }}
  labels:
    {{- include "radix-acr-cleanup.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "radix-acr-cleanup.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if (.Values.metrics.enabled) }}
      annotations:
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
        {{- if (.Values.metrics.extraAnnotations) }}
        {{- toYaml .Values.metrics.extraAnnotations | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        azure.workload.identity/use: "true"
        {{- include "radix-acr-cleanup.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "radix-acr-cleanup.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          env:
            - name: PERIOD
              value: {{ .Values.period | quote }}
            - name: REGISTRY
              value: {{ required "registry is required" .Values.registry | quote }}
            - name: CLUSTER_TYPE
              value: {{ required "cluster type is required" .Values.clusterType | quote }}
            - name: ACTIVE_CLUSTER_NAME
              value: {{ required "active cluster name is required" .Values.activeClusterName | quote }}
            - name: CURRENT_CLUSTER_NAME
              value: {{ required "current cluster name is required" .Values.currentClusterName | quote }}
            - name: DELETE_UNTAGGED
              value: {{ .Values.deleteUntagged | quote }}
            - name: RETAIN_LATEST_UNTAGGED
              value: {{ .Values.retainLatestUntagged | quote }}
            - name: PERFORM_DELETE
              value: {{ .Values.performDelete | quote }}
            - name: CLEANUP_DAYS
              value: {{ .Values.cleanupDays | quote }}
            - name: CLEANUP_START
              value: {{ .Values.cleanupStart | quote }}
            - name: CLEANUP_END
              value: {{ .Values.cleanupEnd | quote }}
            - name: WHITELISTED
              value: {{ include "helm-toolkit.utils.joinListWithComma" .Values.whitelisted | quote }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
