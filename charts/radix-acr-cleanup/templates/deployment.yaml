apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "radix-acr-cleanup.fullname" . }}
  labels:
    {{- include "radix-acr-cleanup.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "radix-acr-cleanup.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if (.Values.metrics.enabled) }}
      annotations:
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
        {{- if (.Values.metrics.annotations) }}
        {{- toYaml .Values.metrics.annotations | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        azure.workload.identity/use: "true"
        {{- include "radix-acr-cleanup.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "radix-acr-cleanup.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: azure-login
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          restartPolicy: Always
          command:
            - /bin/sh
            - -c
          args:
            - |
              while true; do
                if az login \
                  --service-principal \
                  --username "$AZURE_CLIENT_ID" \
                  --tenant "$AZURE_TENANT_ID" \
                  --federated-token "$(cat "$AZURE_FEDERATED_TOKEN_FILE")" \
                  --allow-no-subscriptions; then
                  date +%s > /home/nonroot/.azure/login-ok
                else
                  rm -f /home/nonroot/.azure/login-ok
                  exit 1
                fi
                sleep 1800
              done
          volumeMounts:
            - name: azurehome
              mountPath: /home/nonroot/.azure
          resources:
            {{- toYaml .Values.azureLogin.resources | nindent 12 }}
          {{- with .Values.azureLogin.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          command:
            - /bin/sh
            - -c
          args:
            - |
              until [ -f /home/nonroot/.azure/login-ok ]; do
                echo "Waiting for Azure login to complete"
                sleep 5
              done
              exec ./run_acr_cleanup.sh
          env:
            - name: PERIOD
              value: {{ .Values.period | quote }}
            - name: REGISTRY
              value: {{ required "registry is required" .Values.registry | quote }}
            - name: SUBSCRIPTION_ID
              value: {{ required "subscription id is required" .Values.subscriptionId | quote }}
            - name: CLUSTER_TYPE
              value: {{ required "cluster type is required" .Values.clusterType | quote }}
            - name: ACTIVE_CLUSTER_NAME
              value: {{ required "active cluster name is required" .Values.activeClusterName | quote }}
            - name: CURRENT_CLUSTER_NAME
              value: {{ required "current cluster name is required" .Values.currentClusterName | quote }}
            - name: DELETE_UNTAGGED
              value: {{ .Values.deleteUntagged | quote }}
            - name: RETAIN_LATEST_UNTAGGED
              value: {{ .Values.retainLatestUntagged | quote }}
            - name: PERFORM_DELETE
              value: {{ .Values.performDelete | quote }}
            - name: CLEANUP_DAYS
              value: {{ .Values.cleanupDays | quote }}
            - name: CLEANUP_START
              value: {{ .Values.cleanupStart | quote }}
            - name: CLEANUP_END
              value: {{ .Values.cleanupEnd | quote }}
            - name: WHITELISTED
              value: {{ include "helm-toolkit.utils.joinListWithComma" .Values.whitelisted | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logging.level | quote }}
            - name: PRETTY_PRINT
              value: {{ .Values.logging.prettyPrint | quote }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
            - name: azurehome
              mountPath: /home/nonroot/.azure
          {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  last_login=$(cat /home/nonroot/.azure/login-ok) &&
                  now=$(date +%s) &&
                  [ $((now - last_login)) -lt 2100 ]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: azurehome
          emptyDir:
            sizeLimit: 100M
      {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
