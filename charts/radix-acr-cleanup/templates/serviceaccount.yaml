apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "radix-acr-cleanup.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "radix-acr-cleanup.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ required "azureClientId is required" .Values.azureClientId | quote }}
    {{- with .Values.azureTenantId }}
    azure.workload.identity/tenant-id: {{ . | quote }}
    {{- end }}
    {{- with omit .Values.serviceAccount.extraAnnotations "azure.workload.identity/client-id" "azure.workload.identity/tenant-id" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}