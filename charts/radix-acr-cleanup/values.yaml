registry: ""
clusterType: ""
activeClusterName: ""
currentClusterName: ""

azureTenantId: ""
azureClientId: ""

# Parameters to control behavior
deleteUntagged: false
retainLatestUntagged: 5
performDelete: false
period: 60m
cleanupDays: "su,mo,tu,we,th,fr,sa"
cleanupStart: "0:00"
cleanupEnd: "6:00"
whitelisted: []

logging:
  level: info
  prettyPrint: false

metrics:
  enabled: false
  annotations: {}

serviceAccount:
  # The name of the service account to use.
  # If not set, a name is generated using the fullname template
  name: ""
  # Annotations to add to the service account
  annotations: {}

image:
  repository: ghcr.io/equinor/radix/acr-cleanup
  tag: ""
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

resources:
  limits:
    cpu: 2000m
    memory: 150Mi
  requests:
    cpu: 50m
    memory: 150Mi

nodeSelector: {}

tolerations: []

affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  privileged: false
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false

# Additional volumes to add to the radix-acr-cleanup pod.
extraVolumes: []

# Additional volume mounts to add to the radix-acr-cleanup pod.
extraVolumeMounts: []
